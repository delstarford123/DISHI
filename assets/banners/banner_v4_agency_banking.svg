  <text x="600" y="85" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="22" fill="#34D399" letter-spacing="3">
    WAKALA WA FEDHA NA CHAKULA • DISHI AGENT
  </text>

  <text x="600" y="165" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="2">
