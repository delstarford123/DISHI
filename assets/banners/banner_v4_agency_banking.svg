<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03160c"/>
      <stop offset="50%" stop-color="#082b18"/>
      <stop offset="100%" stop-color="#021008"/>
    </linearGradient>
    <radialGradient id="standoffGrad4" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d1d5db"/>
      <stop offset="70%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
  </defs>

  <rect x="20" y="20" width="1160" height="760" rx="36" fill="url(#bgGrad4)" stroke="#10B981" stroke-width="8"/>
  <rect x="38" y="38" width="1124" height="724" rx="26" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <!-- Standoffs -->
  <circle cx="65" cy="65" r="18" fill="url(#standoffGrad4)" stroke="#111827" stroke-width="2"/><circle cx="65" cy="65" r="6" fill="#374151"/>
  <circle cx="1135" cy="65" r="18" fill="url(#standoffGrad4)" stroke="#111827" stroke-width="2"/><circle cx="1135" cy="65" r="6" fill="#374151"/>
  <circle cx="65" cy="735" r="18" fill="url(#standoffGrad4)" stroke="#111827" stroke-width="2"/><circle cx="65" cy="735" r="6" fill="#374151"/>
  <circle cx="1135" cy="735" r="18" fill="url(#standoffGrad4)" stroke="#111827" stroke-width="2"/><circle cx="1135" cy="735" r="6" fill="#374151"/>

