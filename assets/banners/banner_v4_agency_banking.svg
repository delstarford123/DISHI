    <rect x="0" y="0" width="410" height="150" rx="18" fill="#02140a" stroke="#10B981" stroke-width="2"/>
    <circle cx="60" cy="75" r="34" fill="#05D5AA" fill-opacity="0.15"/>
    <text x="60" y="87" text-anchor="middle" font-size="36">💰</text>
    <text x="120" y="55" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">Kuweka &amp; Kutoa Salio</text>
    <text x="120" y="85" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">0.5% Commission kwa Wakala</text>
    <text x="120" y="110" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#34D399">Top-up DISHI Wallet Papo Hapo</text>

    <!-- Box 2: Milo Safi -->
    <rect x="470" y="0" width="410" height="150" rx="18" fill="#02140a" stroke="#10B981" stroke-width="2"/>
    <circle cx="530" cy="75" r="34" fill="#F59E0B" fill-opacity="0.15"/>
    <text x="530" y="87" text-anchor="middle" font-size="36">🍲</text>
    <text x="590" y="55" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">Milo &amp; Vinywaji Chuoni</text>
    <text x="590" y="85" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">Chakula Safi cha Wanafunzi</text>
    <text x="590" y="110" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#FBBF24">Lipia kwa Simu au Kadi</text>

    <!-- Box 3: Ajira za DeLiv & Fundi -->
    <rect x="0" y="180" width="410" height="150" rx="18" fill="#02140a" stroke="#10B981" stroke-width="2"/>
    <circle cx="60" cy="255" r="34" fill="#F59E0B" fill-opacity="0.15"/>
    <text x="60" y="267" text-anchor="middle" font-size="36">🛵</text>
    <text x="120" y="235" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">Sajili Ajira ya Chuo</text>
    <text x="120" y="265" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">DeLiv Riders (Usafirishaji)</text>
    <text x="120" y="290" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#34D399">DISHI Fundi (Gigs &amp; Ufundi)</text>

    <!-- Box 4: Gonga Kadi -->
    <rect x="470" y="180" width="410" height="150" rx="18" fill="#02140a" stroke="#10B981" stroke-width="2"/>
    <circle cx="530" cy="255" r="34" fill="#05D5AA" fill-opacity="0.15"/>
    <text x="530" y="267" text-anchor="middle" font-size="36">💳</text>
    <text x="590" y="235" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">Kadi ya DISHI (NFC)</text>
    <text x="590" y="265" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">Gonga Ulishe (Tap-to-Eat)</text>
    <text x="590" y="290" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#FBBF24">Bila Intaneti, Hakuna Foleni</text>
