<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c10"/>
      <stop offset="50%" stop-color="#06381e"/>
      <stop offset="100%" stop-color="#01120a"/>
    </linearGradient>
    <linearGradient id="neonMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#05D5AA"/>
    </linearGradient>
    <radialGradient id="standoffGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d1d5db"/>
      <stop offset="70%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Plate Base -->
  <rect x="20" y="20" width="1160" height="760" rx="36" fill="url(#bgGrad2)" stroke="url(#neonMintGrad)" stroke-width="8" filter="url(#shadow2)"/>
  
  <!-- Inner Border -->
  <rect x="38" y="38" width="1124" height="724" rx="26" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Corner Standoffs -->
  <circle cx="65" cy="65" r="18" fill="url(#standoffGrad2)" stroke="#111827" stroke-width="2"/>
  <circle cx="65" cy="65" r="6" fill="#374151"/>
  <circle cx="1135" cy="65" r="18" fill="url(#standoffGrad2)" stroke="#111827" stroke-width="2"/>
  <circle cx="1135" cy="65" r="6" fill="#374151"/>
  <circle cx="65" cy="735" r="18" fill="url(#standoffGrad2)" stroke="#111827" stroke-width="2"/>
  <circle cx="65" cy="735" r="6" fill="#374151"/>
  <circle cx="1135" cy="735" r="18" fill="url(#standoffGrad2)" stroke="#111827" stroke-width="2"/>
  <circle cx="1135" cy="735" r="6" fill="#374151"/>

  <!-- Header -->
  <rect x="280" y="65" width="640" height="42" rx="21" fill="#05D5AA" fill-opacity="0.2"/>
  <text x="600" y="93" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#05D5AA" letter-spacing="4">
    CAMPUS YOUTH EMPOWERMENT HUB
  </text>
  
  <text x="600" y="175" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" letter-spacing="2">
    KITUO CHA DISHI
  </text>

  <!-- Badge DISHI NA SISI -->
  <g transform="translate(600, 275)">
    <rect x="-140" y="-35" width="280" height="70" rx="35" fill="#031f11" stroke="#34D399" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="32" fill="#FCD34D" letter-spacing="3">
      DISHI NA SISI
    </text>
  </g>

  <!-- Main Slogan -->
  <text x="600" y="380" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="30" fill="#FCD34D" letter-spacing="1">
    CHAKULA CHA HESHIMA • AJIRA YA UHAKIKA
  </text>
  <text x="600" y="415" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="18" fill="#D1D5DB">
    Tunawawezesha wanafunzi kujitegemea kimasomo, kiuchumi na kilishe
  </text>

  <!-- Two Main Pillars (Food + Jobs) -->
  <!-- Box 1: Student Nutrition -->
  <g transform="translate(370, 540)">
    <rect x="-210" y="-80" width="420" height="150" rx="20" fill="#02170d" stroke="#05D5AA" stroke-width="2"/>
    <circle cx="-140" cy="-5" r="38" fill="#05D5AA" fill-opacity="0.2"/>
    <!-- Food Bowl Icon -->
    <path d="M -160 -10 Q -140 25 -120 -10 Z" fill="#34D399"/>
    <path d="M -165 -12 L -115 -12" stroke="#34D399" stroke-width="3"/>
    <text x="-80" y="-15" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">LISHE BORA CHUONI</text>
    <text x="-80" y="12" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">Milo safi, bei nafuu ya comrade</text>
    <text x="-80" y="34" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">Vinywaji &amp; Gonga Kadi (Tap-to-Eat)</text>
  </g>

  <!-- Box 2: Campus Jobs -->
  <g transform="translate(830, 540)">
    <rect x="-210" y="-80" width="420" height="150" rx="20" fill="#02170d" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="-140" cy="-5" r="38" fill="#F59E0B" fill-opacity="0.2"/>
    <!-- Motorcycle / Wrench Icon -->
    <circle cx="-152" cy="10" r="10" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="-128" cy="10" r="10" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <path d="M -152 10 L -140 -5 L -130 5 L -128 10" stroke="#F59E0B" stroke-width="3" fill="none"/>
    <text x="-80" y="-15" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">AJIRA ZA WANAFUNZI</text>
    <text x="-80" y="12" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">DeLiv (Campus Delivery Riders)</text>
    <text x="-80" y="34" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">DISHI Fundi (Ufundi &amp; Huduma)</text>
  </g>

  <!-- Footer: Google Play Store (Large & Prominent) -->
  <g transform="translate(600, 672)">
    <rect x="-160" y="-28" width="320" height="56" rx="14" fill="#000000" stroke="#34D399" stroke-width="2"/>
    <path d="M -135 -14 L -110 0 L -135 14 Z" fill="#00E5FF"/>
    <path d="M -135 -14 L -122 -3 L -117 -7 Z" fill="#34D399"/>
    <path d="M -135 14 L -122 3 L -117 7 Z" fill="#F87171"/>
    <path d="M -110 0 L -117 -7 L -117 7 Z" fill="#FBBF24"/>
    <text x="-65" y="-5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#9CA3AF" letter-spacing="1.5">DOWNLOAD DISHI IN</text>
    <text x="-65" y="16" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="0.5">Google Play</text>
  </g>

  <!-- Website Link at the Very Bottom -->
  <text x="600" y="742" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#34D399" letter-spacing="2">
    dishi.delstarfordworks.co.ke
  </text>
</svg>
