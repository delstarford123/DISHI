<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Green -->
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031f13"/>
      <stop offset="50%" stop-color="#062b1a"/>
      <stop offset="100%" stop-color="#02140c"/>
    </linearGradient>
    
    <!-- Frosted Acrylic Glass Rim -->
    <linearGradient id="frostedGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Chrome Standoff Gradient -->
    <radialGradient id="standoffGrad10" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e5e7eb"/>
      <stop offset="70%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#374151"/>
    </radialGradient>
  </defs>

  <!-- Clear / Frosted Acrylic Outer Plaque -->
  <rect x="20" y="20" width="1160" height="760" rx="36" fill="url(#frostedGlassRim)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Inner Deep Green Acrylic Panel -->
  <rect x="50" y="50" width="1100" height="700" rx="24" fill="url(#bgGrad10)"/>

  <!-- Brushed Metal Standoff Bolts (Drill Mounts) -->
  <circle cx="85" cy="85" r="22" fill="url(#standoffGrad10)" stroke="#1f2937" stroke-width="2"/>
  <circle cx="85" cy="85" r="7" fill="#4b5563"/>

  <circle cx="1115" cy="85" r="22" fill="url(#standoffGrad10)" stroke="#1f2937" stroke-width="2"/>
  <circle cx="1115" cy="85" r="7" fill="#4b5563"/>

  <circle cx="85" cy="715" r="22" fill="url(#standoffGrad10)" stroke="#1f2937" stroke-width="2"/>
  <circle cx="85" cy="715" r="7" fill="#4b5563"/>

  <circle cx="1115" cy="715" r="22" fill="url(#standoffGrad10)" stroke="#1f2937" stroke-width="2"/>
  <circle cx="1115" cy="715" r="7" fill="#4b5563"/>

  <!-- Clean Minimalist Header -->
  <text x="600" y="160" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="3">
    HAPA NI WAKALA WA DISHI
  </text>
  <text x="600" y="215" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="28" fill="#F59E0B" letter-spacing="4">
    OFFICIAL DISHI AGENT
  </text>

  <!-- 3 Minimalist Vector Line Art Columns -->
  <!-- Col 1: Plate & Drinks -->
  <g transform="translate(300, 390)">
    <!-- Plate & Fork Line Art -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <path d="M -16 -20 L -16 15 M -22 -20 L -22 -5 M -10 -20 L -10 -5 M -22 -5 Q -16 0 -10 -5" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 16 -20 L 16 15 M 16 -20 Q 24 -10 16 0" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <text x="0" y="85" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">
      Chakula na Vinywaji
    </text>
    <text x="0" y="115" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" fill="#9CA3AF">
      Milo Safi ya Wanafunzi
    </text>
  </g>

  <!-- Col 2: Briefcase & Gigs -->
  <g transform="translate(600, 390)">
    <!-- Briefcase Line Art -->
    <rect x="-35" y="-25" width="70" height="50" rx="8" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <path d="M -16 -25 L -16 -36 Q 0 -42 16 -36 L 16 -25" stroke="#F59E0B" stroke-width="3" fill="none"/>
    <path d="M -35 -2 L 35 -2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>

    <text x="0" y="85" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">
      Ajira na Fursa Chuoni
    </text>
    <text x="0" y="115" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" fill="#9CA3AF">
      DeLiv Riders &amp; DISHI Fundi
    </text>
  </g>

  <!-- Col 3: NFC Contactless Tap -->
  <g transform="translate(900, 390)">
    <!-- Contactless Card Line Art -->
    <rect x="-36" y="-26" width="72" height="52" rx="8" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <path d="M 5 -12 A 16 16 0 0 1 5 12" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 14 -18 A 24 24 0 0 1 14 18" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <text x="0" y="85" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">
      Gonga Kadi ya DISHI
    </text>
    <text x="0" y="115" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" fill="#9CA3AF">
      Tap to Eat (NFC)
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="200" y1="580" x2="1000" y2="580" stroke="#05D5AA" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Footer: Google Play Store (Large & Prominent) -->
  <g transform="translate(600, 660)">
    <rect x="-160" y="-28" width="320" height="56" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M -135 -14 L -110 0 L -135 14 Z" fill="#00E5FF"/>
    <path d="M -135 -14 L -122 -3 L -117 -7 Z" fill="#34D399"/>
    <path d="M -135 14 L -122 3 L -117 7 Z" fill="#F87171"/>
    <path d="M -110 0 L -117 -7 L -117 7 Z" fill="#FBBF24"/>
    <text x="-65" y="-5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#9CA3AF" letter-spacing="1.5">DOWNLOAD DISHI IN</text>
    <text x="-65" y="16" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="0.5">Google Play</text>
  </g>

  <!-- Website Link at the Very Bottom -->
  <text x="600" y="730" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#F59E0B" letter-spacing="2">
    dishi.delstarfordworks.co.ke • DISHI NA SISI
  </text>
</svg>
