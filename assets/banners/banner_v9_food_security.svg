<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03170b"/>
      <stop offset="50%" stop-color="#072d17"/>
      <stop offset="100%" stop-color="#010f07"/>
    </linearGradient>
    <radialGradient id="standoffGrad9" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d1d5db"/>
      <stop offset="70%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
  </defs>

  <rect x="20" y="20" width="1160" height="760" rx="36" fill="url(#bgGrad9)" stroke="#10B981" stroke-width="8"/>
  <rect x="38" y="38" width="1124" height="724" rx="26" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <!-- Standoffs -->
  <circle cx="65" cy="65" r="18" fill="url(#standoffGrad9)" stroke="#111827" stroke-width="2"/><circle cx="65" cy="65" r="6" fill="#374151"/>
  <circle cx="1135" cy="65" r="18" fill="url(#standoffGrad9)" stroke="#111827" stroke-width="2"/><circle cx="1135" cy="65" r="6" fill="#374151"/>
  <circle cx="65" cy="735" r="18" fill="url(#standoffGrad9)" stroke="#111827" stroke-width="2"/><circle cx="65" cy="735" r="6" fill="#374151"/>
  <circle cx="1135" cy="735" r="18" fill="url(#standoffGrad9)" stroke="#111827" stroke-width="2"/><circle cx="1135" cy="735" r="6" fill="#374151"/>

  <text x="600" y="125" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="50" fill="#FFFFFF" letter-spacing="3">
