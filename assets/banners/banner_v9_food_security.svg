    <circle cx="0" cy="0" r="85" fill="#02140a" stroke="#10B981" stroke-width="4"/>
    <text x="0" y="-8" text-anchor="middle" font-size="46">🌾 🛡️</text>
    <text x="0" y="36" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="18" fill="#FDE68A">DISHI NA SISI</text>
  </g>

  <!-- 3 Pillars -->
  <g transform="translate(600, 520)">
    <rect x="-420" y="-70" width="260" height="150" rx="16" fill="#021208" stroke="#10B981" stroke-width="1.5"/>
    <text x="-290" y="-20" text-anchor="middle" font-size="32">🥖</text>
    <text x="-290" y="20" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Chakula Safi</text>
    <text x="-290" y="48" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#9CA3AF">Milo yenye afya na usalama</text>

    <rect x="-130" y="-70" width="260" height="150" rx="16" fill="#021208" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="-20" text-anchor="middle" font-size="32">💼</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Kujitegemea</text>
    <text x="0" y="48" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#9CA3AF">Fursa za ajira bila kukosa darasa</text>

    <rect x="160" y="-70" width="260" height="150" rx="16" fill="#021208" stroke="#10B981" stroke-width="1.5"/>
    <text x="290" y="-20" text-anchor="middle" font-size="32">🤝</text>
    <text x="290" y="20" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="17" fill="#FFFFFF">Mshikamano</text>
    <text x="290" y="48" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#9CA3AF">Hakuna mwanafunzi anayelala njaa</text>
  </g>

  <!-- Bottom Strip: Google Play Store (Large & Prominent) -->
  <g transform="translate(600, 672)">
    <rect x="-160" y="-28" width="320" height="56" rx="14" fill="#000000" stroke="#10B981" stroke-width="2"/>
    <path d="M -135 -14 L -110 0 L -135 14 Z" fill="#00E5FF"/>
    <path d="M -135 -14 L -122 -3 L -117 -7 Z" fill="#34D399"/>
    <path d="M -135 14 L -122 3 L -117 7 Z" fill="#F87171"/>
    <path d="M -110 0 L -117 -7 L -117 7 Z" fill="#FBBF24"/>
    <text x="-65" y="-5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#9CA3AF" letter-spacing="1.5">DOWNLOAD DISHI IN</text>
    <text x="-65" y="16" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="0.5">Google Play</text>
  </g>

  <!-- Website Link at the Very Bottom -->
  <text x="600" y="742" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#34D399" letter-spacing="2">
