<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a0e"/>
      <stop offset="40%" stop-color="#072a18"/>
      <stop offset="100%" stop-color="#021209"/>
    </linearGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    
    <!-- Chrome Standoff Gradient -->
    <radialGradient id="standoffGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d1d5db"/>
      <stop offset="70%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>

    <!-- Acrylic Gloss Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Plaque Plate Base -->
  <rect x="20" y="20" width="1160" height="760" rx="36" fill="url(#bgGrad1)" stroke="url(#goldGrad1)" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Acrylic Sheen Layer -->
  <path d="M 24 24 L 800 24 L 24 700 Z" fill="url(#sheenGrad)" rx="36" />
  
  <!-- Inner Gold Accent Border -->
  <rect x="38" y="38" width="1124" height="724" rx="26" fill="none" stroke="url(#goldGrad1)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- 4 Corner Standoff Screws (Drill Holes for Mounting) -->
  <circle cx="65" cy="65" r="18" fill="url(#standoffGrad)" stroke="#111827" stroke-width="2"/>
  <circle cx="65" cy="65" r="6" fill="#374151"/>
  
  <circle cx="1135" cy="65" r="18" fill="url(#standoffGrad)" stroke="#111827" stroke-width="2"/>
  <circle cx="1135" cy="65" r="6" fill="#374151"/>
  
  <circle cx="65" cy="735" r="18" fill="url(#standoffGrad)" stroke="#111827" stroke-width="2"/>
  <circle cx="65" cy="735" r="6" fill="#374151"/>
  
  <circle cx="1135" cy="735" r="18" fill="url(#standoffGrad)" stroke="#111827" stroke-width="2"/>
  <circle cx="1135" cy="735" r="6" fill="#374151"/>

  <!-- Header Title -->
  <text x="600" y="130" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="4">
    WAKALA RASMI WA DISHI
  </text>
  <text x="600" y="170" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#05D5AA" letter-spacing="6">
    OFFICIAL DISHI CAMPUS AGENT
  </text>

  <!-- Central Emblem / Badge: DISHI NA SISI -->
  <g transform="translate(600, 290)">
    <circle cx="0" cy="0" r="82" fill="url(#goldGrad1)" stroke="#FFFFFF" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="74" fill="#072a18" stroke="url(#goldGrad1)" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#FCD34D" letter-spacing="2">DISHI</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="19" fill="#FFFFFF" letter-spacing="4">NA SISI</text>
    <path d="M -40 38 L 40 38" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Slogan Banner -->
  <text x="600" y="425" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="800" font-size="32" fill="#FCD34D" letter-spacing="1.5">
    LISHE BORA, AJIRA HALISI KAMPASINI
  </text>

  <!-- 3 Service Columns with Icons -->
  <!-- Column 1: Food & Drinks -->
  <g transform="translate(230, 480)">
    <rect x="-130" y="0" width="260" height="150" rx="16" fill="#041a0e" fill-opacity="0.8" stroke="#05D5AA" stroke-width="1.5"/>
    <!-- Fork & Plate Icon -->
    <circle cx="0" cy="45" r="28" fill="#072a18" stroke="#F59E0B" stroke-width="2"/>
    <path d="M -10 35 L -10 55 M -14 35 L -14 45 M -6 35 L -6 45 M -14 45 Q -10 50 -6 45" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 35 L 10 55 M 10 35 Q 16 42 10 48" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="0" y="105" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">Chakula &amp; Vinywaji</text>
    <text x="0" y="130" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">Milo Safi ya Wanafunzi</text>
  </g>

  <!-- Column 2: Gigs (DeLiv & Fundi) -->
  <g transform="translate(600, 480)">
    <rect x="-130" y="0" width="260" height="150" rx="16" fill="#041a0e" fill-opacity="0.8" stroke="#05D5AA" stroke-width="1.5"/>
    <!-- Gig / Briefcase & Bike Icon -->
    <circle cx="0" cy="45" r="28" fill="#072a18" stroke="#F59E0B" stroke-width="2"/>
    <rect x="-14" y="36" width="28" height="20" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M -6 36 L -6 32 Q 0 30 6 32 L 6 36" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="105" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">Ajira za Wanafunzi</text>
    <text x="0" y="130" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">DeLiv Riders &amp; DISHI Fundi</text>
  </g>

  <!-- Column 3: Tap to Eat / Banking -->
  <g transform="translate(970, 480)">
    <rect x="-130" y="0" width="260" height="150" rx="16" fill="#041a0e" fill-opacity="0.8" stroke="#05D5AA" stroke-width="1.5"/>
    <!-- NFC / Card Icon -->
    <circle cx="0" cy="45" r="28" fill="#072a18" stroke="#F59E0B" stroke-width="2"/>
    <rect x="-16" y="34" width="32" height="22" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 2 40 A 6 6 0 0 1 2 50 M 6 37 A 10 10 0 0 1 6 53" fill="none" stroke="#05D5AA" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="105" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">Kadi ya DISHI</text>
    <text x="0" y="130" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">Gonga Ulishe (Tap-to-Eat)</text>
  </g>

  <!-- Bottom Section: Google Play Store (Large & Clear) -->
  <g transform="translate(600, 670)">
    <!-- Big, High-Contrast Google Play Store Badge -->
    <rect x="-160" y="-28" width="320" height="56" rx="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Vibrant Google Play Triangle Logo -->
    <path d="M -135 -14 L -110 0 L -135 14 Z" fill="#00E5FF"/>
    <path d="M -135 -14 L -122 -3 L -117 -7 Z" fill="#34D399"/>
    <path d="M -135 14 L -122 3 L -117 7 Z" fill="#F87171"/>
    <path d="M -110 0 L -117 -7 L -117 7 Z" fill="#FBBF24"/>
    <text x="-65" y="-5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#9CA3AF" letter-spacing="1.5">DOWNLOAD DISHI IN</text>
    <text x="-65" y="16" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="0.5">Google Play</text>
  </g>

  <!-- Website Link at the Very Bottom -->
  <text x="600" y="742" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#FCD34D" letter-spacing="2">
    dishi.delstarfordworks.co.ke
  </text>
</svg>
