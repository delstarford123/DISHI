<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140a"/>
      <stop offset="50%" stop-color="#042413"/>
      <stop offset="100%" stop-color="#010d06"/>
    </linearGradient>
    <radialGradient id="standoffGrad5" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d1d5db"/>
      <stop offset="70%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
  </defs>

  <rect x="20" y="20" width="1160" height="760" rx="36" fill="url(#bgGrad5)" stroke="#05D5AA" stroke-width="8"/>
  <rect x="38" y="38" width="1124" height="724" rx="26" fill="none" stroke="#05D5AA" stroke-width="2" stroke-dasharray="10, 8"/>

  <!-- Standoffs -->
  <circle cx="65" cy="65" r="18" fill="url(#standoffGrad5)" stroke="#111827" stroke-width="2"/><circle cx="65" cy="65" r="6" fill="#374151"/>
  <circle cx="1135" cy="65" r="18" fill="url(#standoffGrad5)" stroke="#111827" stroke-width="2"/><circle cx="1135" cy="65" r="6" fill="#374151"/>
  <circle cx="65" cy="735" r="18" fill="url(#standoffGrad5)" stroke="#111827" stroke-width="2"/><circle cx="65" cy="735" r="6" fill="#374151"/>
  <circle cx="1135" cy="735" r="18" fill="url(#standoffGrad5)" stroke="#111827" stroke-width="2"/><circle cx="1135" cy="735" r="6" fill="#374151"/>

  <text x="600" y="115" text-anchor="middle" font-family="'Orbitron', 'Montserrat', sans-serif" font-weight="900" font-size="44" fill="#05D5AA" letter-spacing="4">
    DISHI SMART CAMPUS AGENT
  </text>
  <text x="600" y="165" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="2">
    KULA KISASA • KAZI KISASA
  </text>
  <text x="600" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="24" fill="#FBBF24" letter-spacing="1">
    DISHI NA SISI: MFUMO WA KISASA WA MAISHA YA CHUO
  </text>

  <!-- Big Central Tech Showcase -->
  <g transform="translate(600, 420)">
    <!-- Tech Plate Card Graphic -->
    <rect x="-420" y="-170" width="840" height="340" rx="24" fill="#021a0d" stroke="#05D5AA" stroke-width="3"/>
    
    <!-- Left: Tap to Eat Card graphic -->
    <rect x="-370" y="-120" width="220" height="140" rx="14" fill="#072a18" stroke="#34D399" stroke-width="2"/>
    <text x="-260" y="-70" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#FCD34D">DISHI CARD</text>
    <text x="-260" y="-30" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#34D399">TAP TO EAT • NFC</text>
    <text x="-260" y="0" text-anchor="middle" font-size="22">📡 💳</text>

    <!-- Right: Text Description -->
    <text x="-110" y="-90" font-family="'Montserrat', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">1. Gonga Kadi Ulishe (Tap-to-Eat)</text>
    <text x="-110" y="-60" font-family="'Inter', sans-serif" font-size="16" fill="#D1D5DB">Hakuna foleni, hakuna intaneti inayohitajika.</text>

    <text x="-110" y="-10" font-family="'Montserrat', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">2. Milo Safi na Vinywaji Papo Hapo</text>
    <text x="-110" y="20" font-family="'Inter', sans-serif" font-size="16" fill="#D1D5DB">Chakula chenye afya na bei nafuu ya comrade.</text>

    <text x="-110" y="70" font-family="'Montserrat', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">3. Ajira za Kidijitali Chuoni</text>
    <text x="-110" y="100" font-family="'Inter', sans-serif" font-size="16" fill="#D1D5DB">Piga pesa ukiwa chuo kupitia DeLiv na DISHI Fundi.</text>
  </g>

  <!-- Bottom Line: Google Play Store (Large & Prominent) -->
  <g transform="translate(600, 672)">
    <rect x="-160" y="-28" width="320" height="56" rx="14" fill="#000000" stroke="#05D5AA" stroke-width="2"/>
    <path d="M -135 -14 L -110 0 L -135 14 Z" fill="#00E5FF"/>
    <path d="M -135 -14 L -122 -3 L -117 -7 Z" fill="#34D399"/>
    <path d="M -135 14 L -122 3 L -117 7 Z" fill="#F87171"/>
    <path d="M -110 0 L -117 -7 L -117 7 Z" fill="#FBBF24"/>
    <text x="-65" y="-5" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#9CA3AF" letter-spacing="1.5">DOWNLOAD DISHI IN</text>
    <text x="-65" y="16" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="0.5">Google Play</text>
  </g>

  <!-- Website Link at the Very Bottom -->
  <text x="600" y="742" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#05D5AA" letter-spacing="2">
    dishi.delstarfordworks.co.ke • SMART CAMPUS
  </text>
